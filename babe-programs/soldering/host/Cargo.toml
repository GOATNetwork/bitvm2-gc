[package]
name = "soldering-host"
version = "1.1.0"
edition = "2021"

[dependencies]
zkm-sdk = { git = "https://github.com/ProjectZKM/Ziren" }
verifiable-circuit-babe = { path = "../../../verifiable-circuit-babe", features = ["garbled"] }
garbled-snark-verifier = { path = "../../../garbled-snark-verifier" }
ark-bn254 = { version = "0.5.0", features = ["curve", "scalar_field"], default-features = false }
ark-groth16 = "0.5.0"
ark-ff = "0.5.0"
ark-relations = "0.5.0"
ark-crypto-primitives = "0.5.0"
rand = "0.8.5"
tracing = "0.1"

[build-dependencies]
zkm-build = { git = "https://github.com/ProjectZKM/Ziren" }